{% extends 'cadastro/base.html' %}

{% load widget_tweaks %}

{% block titulo %}Editar {{ pessoa.nome }}{% endblock %}

{% block conteudo %}
<article>

    <h2>Editar {{ pessoa.nome }}</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <p>
        <button type="submit">Salvar</button>
        <a href="{% url 'detalhe' id=pessoa.id %}">Cancelar</a>
        </p>
    </form>

</article>
{% endblock %}
